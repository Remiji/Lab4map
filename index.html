
<!DOCTYPE html>
<html>
    <head>
        <title>Heat and Population Density In the London Boroughs  4</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>
        
        
        <script type="text/javascript" src="data.js"></script>
        
        
        <style type="text/css">
          html, body { margin: 0; padding: 0; height: 100%; }
          #map { min-height: 100%; }
        </style>
        
        <style>
          /* Optional: adjust the values below to change the appearance of the legend */
          .legend {
              padding: 6px 8px;
              line-height: 18px;
              background: rgba(255,255,255,0.9);
              box-shadow: 0 0 15px rgba(0,0,0,0.2);
              border-radius: 5px;
          }

          /* Optional: adjust the values below to change the appearance of the legend color boxes */
          .legend i {
              width: 18px;
              height: 18px;
              float: left;
              margin-right: 8px;
              opacity: 0.7;
          }
        </style>

    </head>

    <body>
        <div id="map"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [51.48,-0.07],
              zoom: 10
          });


        var OpenStreetMap_HOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
	maxZoom: 19,
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles style by <a href="https://www.hotosm.org/" target="_blank">Humanitarian OpenStreetMap Team</a> hosted by <a href="https://openstreetmap.fr/" target="_blank">OpenStreetMap France</a>'

        }).addTo(map);

        var Esri_WorldShadedRelief = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
	attribution: 'Tiles &copy; Esri &mdash; Source: Esri',
	maxZoom: 13
});
            
            
        function getColor(value) {
            return value > 139 ? '#54278f':
                   value > 87  ? '#756bb1':
                   value > 53  ? '#9e9ac8':
                   value > 32  ? '#cbc9e2':
                                 '#f2f0f7';
        }

        function style(feature){
            return {
                fillColor: getColor(feature.properties.pop_den),   // pop_den is the field name for the population density data
                weight: 2,
                opacity: 1,
                color: 'gray',
                fillOpacity: 0.9
            };
        }

            
        var boroughs = L.geoJson(data, {style:style}).addTo(map);
            
        
        var legend = L.control({position: 'bottomright'}); // Try the other three corners if you like.

        legend.onAdd = function (map) {

            var div = L.DomUtil.create('div', 'legend'),
                grades = [0, 32, 53, 87, 139]; // The break values that define the intervals, note we begin from 0 here

            div.innerHTML = '<b>Population Density <br> 2011 <br></b>'; // The legend title, written in HTML

            // Loop through the classes and generate a label with a color box for each interval.
            // If you are creating a choropleth map, you DO NOT need to change the lines below.
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
            }

            return div;
        };
var nasa = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?', {
    layers: 'Land Surface Temperature',
    format: 'image/png',
    transparent: true,
    opacity: 0.6,
    attribution: 'Imagery courtesy of NASA EOSDIS GIBS'
}).addTo(map);

var basemaps = {
    "Political": OpenStreetMap_HOT,
    "Terrain": Esri_WorldShadedRelief
};

var overlaymaps = {
    "London Boroughs": boroughs,
    "Land Surface Temperatures": nasa
};

L.control.layers(basemaps, overlaymaps).addTo(map);
        legend.addTo(map);

// Removing the legend when the layer is removed
map.on('overlayremove', function(eventLayer){
  if (eventLayer.name == 'London Boroughs'){ // We use the key/display name to refer to the layer
    map.removeControl(legend); // legend is the variable name of the layer legend
  }
});

// Adding the legend when the layer is added
map.on('overlayadd', function(eventLayer){
  if (eventLayer.name == 'London Boroughs'){
    legend.addTo(map);
  }
});
        </script>
   </body>
</html>
